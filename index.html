<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Common Ground</title>
<style>
  :root { --bg:#eef2ff; --ink:#1b1f3b; --p1:#ff5d5d; --p2:#0a9396; --node:#5b3df5; --card:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--ink); font-family:"Avenir Next","Trebuchet MS",Verdana,sans-serif; }
  main { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 2.2rem; margin: 8px 0 0; text-align: center; }
  .tag { text-align:center; margin: 4px 0 22px; }
  .people { display:flex; gap:16px; flex-wrap:wrap; }
  .person { flex:1 1 300px; background:var(--card); border-radius:12px; padding:16px; border-top:6px solid; }
  .person.one { border-color:var(--p1); } .person.two { border-color:var(--p2); }
  input { width:100%; padding:10px; font-size:1rem; border:2px solid #cfd4f0; border-radius:8px; margin-bottom:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { padding:8px 12px; border:2px solid #cfd4f0; background:#fff; border-radius:999px; font-size:.95rem; cursor:pointer; }
  .one .chip[aria-pressed=true] { background:var(--p1); border-color:var(--p1); color:#fff; }
  .two .chip[aria-pressed=true] { background:var(--p2); border-color:var(--p2); color:#fff; }
  .chip:focus-visible, .btn:focus-visible { outline:3px solid var(--node); outline-offset:2px; }
  .actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:22px 0; }
  .btn { padding:12px 26px; font-size:1.05rem; border:0; border-radius:8px; cursor:pointer; background:var(--ink); color:#fff; }
  .btn.alt { background:#fff; color:var(--ink); border:2px solid var(--ink); }
  #results { background:var(--card); border-radius:12px; padding:20px; text-align:center; }
  .score { font-size:2.6rem; font-weight:800; color:var(--node); margin:0; }
  .label { font-size:1.2rem; margin:0 0 8px; }
  svg { width:100%; height:auto; max-width:640px; }
  .draw { stroke-dasharray:1; stroke-dashoffset:1; animation: draw .7s ease forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .starters { text-align:left; max-width:560px; margin:16px auto 0; padding-left:20px; }
  .starters li { margin-bottom:8px; }
  .hint { color:#555; }
  @media (prefers-reduced-motion: reduce) { .draw { animation:none; stroke-dashoffset:0; } }
</style>
</head>
<body>
<main>
  <h1>Common Ground</h1>
  <p class="tag">Pick your interests. See what connects you.</p>

  <div class="people">
    <section class="person one"><input id="name1" placeholder="Person 1 name" aria-label="Person 1 name"><div class="chips" id="chips1"></div></section>
    <section class="person two"><input id="name2" placeholder="Person 2 name" aria-label="Person 2 name"><div class="chips" id="chips2"></div></section>
  </div>

  <div class="actions">
    <button class="btn" id="connectBtn">Find our connection</button>
    <button class="btn alt" id="demoBtn">Fill demo</button>
    <button class="btn alt" id="resetBtn">Start over</button>
  </div>

  <div id="results"><p class="hint">Choose interests for both people, then press "Find our connection."</p></div>
</main>

<script>
  // ADD INTERESTS HERE: emoji, name, and a handwritten conversation starter.
  const INTERESTS = [
    { e:"🎵", n:"Music",       q:"What song has been on repeat for you lately?" },
    { e:"🎮", n:"Gaming",      q:"What game could you play forever without getting bored?" },
    { e:"⚽", n:"Sports",      q:"Do you play, or are you more of a spectator?" },
    { e:"🍳", n:"Cooking",     q:"What's the best thing you know how to make?" },
    { e:"🎬", n:"Movies",      q:"What's the last movie that actually surprised you?" },
    { e:"✈️", n:"Travel",      q:"What's the best place you've ever been?" },
    { e:"📺", n:"Anime",       q:"Which anime would you tell a total beginner to watch first?" },
    { e:"💻", n:"Coding",      q:"What's the coolest thing you've built so far?" },
    { e:"🥾", n:"Hiking",      q:"What's the best trail or view you've found?" },
    { e:"☕", n:"Coffee",      q:"What's your go-to order, and is it a bit extra?" },
    { e:"🎲", n:"Board games", q:"Which game always ends in an argument?" },
    { e:"📚", n:"Reading",     q:"What book would you press into someone's hands?" },
    { e:"📷", n:"Photography", q:"What's the best photo you've ever taken?" },
    { e:"🏋️", n:"Fitness",     q:"What's your favorite way to move, and what keeps you going?" },
    { e:"🎨", n:"Art",         q:"Do you make art, or just love looking at it?" },
    { e:"🐶", n:"Pets",        q:"Tell me about your pet, or the one you wish you had." }
  ];

  const chosen = { 1: new Set(), 2: new Set() };

  // Build the chip buttons for each person
  [1, 2].forEach(p => {
    const box = document.getElementById("chips" + p);
    INTERESTS.forEach(i => {
      const b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.setAttribute("aria-pressed", "false");
      b.textContent = i.e + " " + i.n;
      b.onclick = () => {
        const on = chosen[p].has(i.n);
        on ? chosen[p].delete(i.n) : chosen[p].add(i.n);
        b.setAttribute("aria-pressed", String(!on));
      };
      box.appendChild(b);
    });
  });

  const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const find = n => INTERESTS.find(i => i.n === n);

  function scoreLabel(pct) {
    if (pct >= 60) return "Instant friends";
    if (pct >= 35) return "Plenty to talk about";
    if (pct >= 15) return "A good start";
    return "Opposites attract";
  }

  function connect() {
    const n1 = document.getElementById("name1").value.trim() || "Person 1";
    const n2 = document.getElementById("name2").value.trim() || "Person 2";
    const out = document.getElementById("results");

    if (chosen[1].size === 0 || chosen[2].size === 0) {
      out.innerHTML = '<p class="hint">Each person needs to pick at least one interest.</p>';
      return;
    }

    const shared = [...chosen[1]].filter(x => chosen[2].has(x));
    const union = new Set([...chosen[1], ...chosen[2]]).size;
    const pct = Math.round(shared.length / union * 100);

    // No overlap: suggest questions about each person's own interests
    if (shared.length === 0) {
      const a = find([...chosen[1]][0]), b = find([...chosen[2]][0]);
      out.innerHTML = `<p class="score">0%</p><p class="label">Opposites attract</p>
        <p>No shared interests yet. That means you each have something new to teach the other.</p>
        <ul class="starters"><li>${esc(n2)}, ${esc(a.q)}</li><li>${esc(n1)}, ${esc(b.q)}</li></ul>`;
      return;
    }

    // Draw the web: person circles on the sides, shared interests in the middle
    const H = Math.max(260, shared.length * 70 + 60), cy = H / 2;
    let svg = `<svg viewBox="0 0 640 ${H}" role="img" aria-label="${esc(n1)} and ${esc(n2)} share ${shared.length} interests">`;
    shared.forEach((name, k) => {
      const y = shared.length === 1 ? cy : 50 + k * ((H - 100) / (shared.length - 1));
      const d = k * 0.12;
      svg += `<path class="draw" pathLength="1" style="animation-delay:${d}s" d="M110 ${cy} Q220 ${y} 255 ${y}" stroke="#ff5d5d" stroke-width="3" fill="none"/>`;
      svg += `<path class="draw" pathLength="1" style="animation-delay:${d}s" d="M385 ${y} Q420 ${y} 530 ${cy}" stroke="#0a9396" stroke-width="3" fill="none"/>`;
      svg += `<rect x="255" y="${y - 20}" width="130" height="40" rx="20" fill="#5b3df5"/>`;
      svg += `<text x="320" y="${y + 5}" text-anchor="middle" fill="#fff" font-size="15">${find(name).e} ${esc(name)}</text>`;
    });
    svg += `<circle cx="70" cy="${cy}" r="42" fill="#ff5d5d"/><text x="70" y="${cy + 5}" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">${esc(n1.slice(0, 8))}</text>`;
    svg += `<circle cx="570" cy="${cy}" r="42" fill="#0a9396"/><text x="570" y="${cy + 5}" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">${esc(n2.slice(0, 8))}</text></svg>`;

    const starters = shared.map(n => `<li><b>${find(n).e} ${esc(n)}:</b> ${esc(find(n).q)}</li>`).join("");
    out.innerHTML = `<p class="score">${pct}%</p><p class="label">${scoreLabel(pct)}</p>${svg}
      <p>${esc(n1)} and ${esc(n2)} share ${shared.length} interest${shared.length > 1 ? "s" : ""}. Start here:</p>
      <ul class="starters">${starters}</ul>`;
  }

  function setChips(p, names) {
    chosen[p] = new Set(names);
    document.querySelectorAll("#chips" + p + " .chip").forEach((b, i) =>
      b.setAttribute("aria-pressed", String(chosen[p].has(INTERESTS[i].n))));
  }

  document.getElementById("connectBtn").onclick = connect;
  document.getElementById("demoBtn").onclick = () => {
    document.getElementById("name1").value = "Alex";
    document.getElementById("name2").value = "Sam";
    setChips(1, ["Music", "Gaming", "Coding", "Coffee", "Hiking"]);
    setChips(2, ["Music", "Coding", "Coffee", "Movies", "Anime"]);
    connect();
  };
  document.getElementById("resetBtn").onclick = () => {
    ["name1", "name2"].forEach(id => document.getElementById(id).value = "");
    setChips(1, []); setChips(2, []);
    document.getElementById("results").innerHTML = '<p class="hint">Choose interests for both people, then press "Find our connection."</p>';
  };
</script>
</body>
</html>
